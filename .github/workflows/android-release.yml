name: Build APK for Release (Full & FOSS) && Desktop app release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build-full-release:
    name: Build full release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Setup Keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > release.keystore
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${KEY_ALIAS:-vibeflow}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-vibeflowpass}" \
              -keypass "${KEY_PASSWORD:-vibeflowpass}" \
              -dname "CN=VibeFlow, OU=OpenSource, O=VibeFlow, C=NP"
          fi

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release
          path: androidApp/build/outputs/apk/release/VibeFlow-*.apk

  build-foss-release:
    name: Build foss release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Setup Keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > release.keystore
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${KEY_ALIAS:-vibeflow}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-vibeflowpass}" \
              -keypass "${KEY_PASSWORD:-vibeflowpass}" \
              -dname "CN=VibeFlow, OU=OpenSource, O=VibeFlow, C=NP"
          fi

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Build foss release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-release
          path: androidApp/build/outputs/apk/release/VibeFlow-*.apk

  build-desktop-packages:
    name: Build desktop packages (AppImage + Mac zip + Windows msix)
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Create local.properties
        run: touch ./local.properties

      - name: Install libfuse2
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Prepopulate Conveyor release cache with mpv archives
        run: |
          mkdir -p ~/.gradle/caches/conveyor/https/github.com/maxrave-dev/mpv-build-autobuilds/releases/download/2026-03-31-03-31/
          cp mpv-natives/mpv-linux-x86_64-v3-*.tar.gz ~/.gradle/caches/conveyor/https/github.com/maxrave-dev/mpv-build-autobuilds/releases/download/2026-03-31-03-31/ 2>/dev/null || true
          cp mpv-natives/mpv-mac-x86_64-*.tar.gz ~/.gradle/caches/conveyor/https/github.com/maxrave-dev/mpv-build-autobuilds/releases/download/2026-03-31-03-31/ 2>/dev/null || true
          cp mpv-natives/mpv-mac-aarch64-*.tar.gz ~/.gradle/caches/conveyor/https/github.com/maxrave-dev/mpv-build-autobuilds/releases/download/2026-03-31-03-31/ 2>/dev/null || true
          cp mpv-natives/mpv-windows-x86_64-*.zip ~/.gradle/caches/conveyor/https/github.com/maxrave-dev/mpv-build-autobuilds/releases/download/2026-03-31-03-31/ 2>/dev/null || true

      - name: Build and stage native libraries
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Build Linux AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (make site, Mac + Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        continue-on-error: true
        with:
          command: '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Stage AppImage into output/ for upload
        run: |
          mkdir -p output/
          cp desktopApp/build/appimage/conveyor/*.AppImage output/ 2>/dev/null || true

      - name: Show built artifacts
        run: ls -lh output/ || true

      - name: Upload AppImage to run artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-appimage
          path: output/*.AppImage

      - name: Upload macOS zips to run artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-zips
          path: output/*.zip

      - name: Bundle Windows offline installer
        continue-on-error: true
        run: |
          set -euo pipefail
          msix=$(ls output/*.msix 2>/dev/null | head -1 || true)
          if [ -n "$msix" ]; then
            mkdir -p installers/
            stage="$(mktemp -d)"
            cp scripts/windows/install.bat "$stage/"
            cp output/simpmusic.crt        "$stage/" 2>/dev/null || true
            cp "$msix"                      "$stage/"
            ( cd "$stage" && zip -q -j \
              "${GITHUB_WORKSPACE}/installers/VibeFlow-Windows-installer.zip" \
              install.bat simpmusic.crt "$(basename "$msix")" )
            rm -rf "$stage"
          fi

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-windows
          path: installers/VibeFlow-Windows-installer.zip

  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg (installer UX)
    runs-on: macos-14
    needs: build-desktop-packages
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background (Lanczos resize 2800x1600 → 1400x800)
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a polished .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for zip in mac-zips/*.zip; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && arch="universal"
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            out="dist/VibeFlow-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
          done
          ls -lh dist/ || true

      - name: Upload Mac .dmg artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-dmg
          path: dist/*.dmg

  publish-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-full-release, build-foss-release, build-desktop-packages, wrap-mac-dmg]
    if: always() && (needs.build-full-release.result == 'success' || needs.build-foss-release.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Create release directory
        run: mkdir -p release_files

      - name: Download Full APK artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-full-release
          path: release_files/

      - name: Download FOSS APK artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-foss-release
          path: release_files/

      - name: Download Desktop AppImage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-appimage
          path: release_files/

      - name: Download Desktop Windows Installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-windows
          path: release_files/

      - name: Download Desktop Mac DMG
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-dmg
          path: release_files/

      - name: Generate Checksums
        working-directory: release_files
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('VibeFlow v{0}', steps.version.outputs.version) }}
          body: |
            ## 🎵 VibeFlow v${{ steps.version.outputs.version }}
            
            A modern, open-source YouTube Music client for Android & Desktop built with Compose Multiplatform.
            
            ### 📱 Android Downloads:
            * **FOSS Release (`.apk`)**: Recommended build without proprietary trackers.
            * **Full Release (`.apk`)**: Standard release build.
            
            ### 💻 Desktop Downloads:
            * **Windows**: Download `VibeFlow-Windows-installer.zip`, extract, and run `install.bat`.
            * **macOS**: Download `VibeFlow-...-mac-*.dmg` for Apple Silicon / Intel.
            * **Linux**: Download `.AppImage` (`chmod +x *.AppImage` and run).
            
            ---
            *Maintained with ❤️ by **Prabin Chandra Shrestha** ([pcshrestha.com.np](https://pcshrestha.com.np))*  
            *Based on upstream [SimpMusic](https://github.com/maxrave-dev/SimpMusic) under GPL-3.0.*
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: release_files/*
          fail_on_unmatched_files: false
